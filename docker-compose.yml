services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: welfare
      POSTGRES_PASSWORD: welfare
      POSTGRES_DB: welfare
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welfare -d welfare"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
